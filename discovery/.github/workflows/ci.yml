name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[benchmark]'
      - run: python -m unittest discover -s tests -v
      - run: lupine-discovery verify examples/abstract.json examples/abstract.certificate.json
      - run: lupine-discovery replay examples/abstract.json examples/abstract.outcomes.json
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build pinned proof package
        working-directory: formal
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true
          lake --wfail build
          python3 -m unittest test_audit_axioms -v
          python3 audit_axioms.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test-ui]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-browser-checks
          path: .cache/browser
          retention-days: 7
