name: Deploy Glim Think Worker

on:
  push:
    branches:
      - main
    paths:
      - 'glim-think/**'
      - '.github/workflows/deploy-glim-think.yml'
  # Manual trigger — lets a branch be validated on REAL CI (the gating
  # `npm test`/typecheck) before it lands on main. Local vitest has shown
  # false-green here; CI fresh-install is authoritative. Deploy still only
  # runs if tests pass, so dispatching a fix branch is safe.
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref_name != 'ops/glim-ledger-d1-maintenance' }}
    runs-on: ubuntu-latest
    # Without this a hung `npm test`/`npm run lint` sits for GitHub's 6h
    # default, silently blocking deploys (observed: a 33-min stuck run).
    # Fail fast and visibly instead.
    timeout-minutes: 15
    permissions:
      contents: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: glim-think
        run: |
          npm install --prefer-offline --no-audit

      # `tsc --noEmit` hangs indefinitely in CI on this project (observed:
      # 15 min, killed by the job cap, deploy skipped). continue-on-error
      # does NOT cover a hang — it only applies once a step finishes. A
      # step-level timeout bounds it; lint is advisory here, not a deploy
      # gate, so a timed-out type check must not block the deploy.
      - name: Type check
        working-directory: glim-think
        continue-on-error: true
        timeout-minutes: 4
        run: npm run lint

      - name: Run unit tests
        working-directory: glim-think
        timeout-minutes: 6
        run: npm test

      # Compile src/registry/prompts/*.md → prompts.gen.ts so Evolver-committed
      # prompt variants land in the Worker bundle (wrangler can't read .md at
      # runtime). The generated file is also committed, so this is idempotent.
      - name: Regenerate prompt registry
        working-directory: glim-think
        run: node scripts/gen-prompts.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: glim-think
          command: deploy

      - name: Report deploy status
        if: always()
        run: |
          curl -X POST https://glim-think-v1.aw-ab5.workers.dev/ops/report \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_id\":\"$GITHUB_RUN_ID\",\"status\":\"${{ job.status }}\",\"commit_sha\":\"$GITHUB_SHA\",\"branch\":\"$GITHUB_REF_NAME\",\"service\":\"glim-think\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

  glim-ledger-d1-maintenance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'ops/glim-ledger-d1-maintenance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed lupine-rhizo revision
        uses: actions/checkout@v4
        with:
          repository: alexwelcing/lupine-rhizo
          ref: 1b2c242186fea61817e9a60cfadd0ea3fb7bd5f7
          path: lupine-rhizo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install D1 client
        working-directory: lupine-rhizo/glim-think
        run: npm install --no-save --package-lock=false wrangler@4.85.0

      - name: Validate Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "${CLOUDFLARE_API_TOKEN}" != '-'

      - name: Preflight production D1 read access
        working-directory: lupine-rhizo/glim-think
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab547d0fb51be7294e883ca90a00929c
        run: npx wrangler d1 execute glim-ledger --remote --command "SELECT 1"

      - name: Apply migrations and seed reviewed literature hypothesis
        working-directory: lupine-rhizo/glim-think
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab547d0fb51be7294e883ca90a00929c
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply glim-ledger --remote
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('../examples/literature-hypotheses/protocol-offset-sign-skew.json')
          contract = json.loads(path.read_text())
          canonical = json.dumps(contract, separators=(',', ':'), sort_keys=True)
          statement = (
              "INSERT INTO literature_hypotheses "
              "(literature_hypothesis_id, contract_json) "
              "VALUES ('lit-hypothesis.protocol-offset-sign-skew.v1', "
              f"'{canonical.replace(chr(39), chr(39) * 2)}') "
              "ON CONFLICT(literature_hypothesis_id) DO UPDATE SET "
              "contract_json = excluded.contract_json;"
          )
          Path('../seed-production-hypotheses.sql').write_text(
              statement + '\n', encoding='utf-8'
          )
          PY
          npx wrangler d1 execute glim-ledger --remote \
            --file ../seed-production-hypotheses.sql

      - name: Verify protocol-offset sign-skew in production D1
        working-directory: lupine-rhizo/glim-think
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab547d0fb51be7294e883ca90a00929c
        run: |
          set -euo pipefail
          npx wrangler d1 execute glim-ledger --remote --json \
            --command "SELECT literature_hypothesis_id, json_extract(contract_json, '$.source.doi') AS source_doi, json_extract(contract_json, '$.source.asOf') AS source_as_of, json_extract(contract_json, '$.proposedExperiment.metric') AS metric, json_extract(contract_json, '$.proposedExperiment.predicate') AS predicate, json_extract(contract_json, '$.epistemicMarker') AS epistemic_marker, json_extract(contract_json, '$.readiness') AS readiness, json_extract(contract_json, '$.status') AS status FROM literature_hypotheses WHERE literature_hypothesis_id = 'lit-hypothesis.protocol-offset-sign-skew.v1';" \
            > ../production-d1-readback.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('../production-d1-readback.json').read_text())
          rows = payload[0]['results'] if isinstance(payload, list) else payload['results']
          assert len(rows) == 1, rows
          row = rows[0]
          assert row['literature_hypothesis_id'] == 'lit-hypothesis.protocol-offset-sign-skew.v1'
          assert row['source_doi'] == '10.1038/s41524-025-01571-z'
          assert row['source_as_of'] == '2026-08-01'
          assert row['metric'] == 'signed_error_positive'
          assert row['predicate'] == 'signed_error_positive_fraction>0.5'
          assert row['epistemic_marker'] == 'OBS'
          assert row['readiness'].startswith('M (')
          assert row['status'] == 'proposed'
          print('production D1 readback verified for protocol-offset sign/skew')
          PY
