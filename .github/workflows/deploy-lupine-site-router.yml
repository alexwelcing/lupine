name: Retired Lupine Science start router deploy guard

on:
  workflow_dispatch: {}

jobs:
  retired:
    runs-on: ubuntu-latest

    steps:
      - name: Report retired deploy path
        run: |
          {
            echo "### lupine.science deploy moved"
            echo
            echo "This monorepo workflow no longer deploys lupine.science."
            echo "lupine.science deploys from alexwelcing/lupine-science (Cloudflare Pages)."
            echo "The old start-router copy is archived at archive/lupine-site-router/ and is not deployable from here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Retired deploy path. Use the alexwelcing/lupine-science repository."
          exit 1
