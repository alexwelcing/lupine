name: Deploy glim viewer to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'atlas/**'
      - '.github/workflows/deploy-glim-viewer.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/atlas-view/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: atlas/atlas-view
        run: pnpm install

      - name: Validate Viewer Firebase Config
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::MISSING SECRET: LUPI_FIREBASE_WEB_API_KEY is not defined in GitHub Repo Secrets."
            exit 1
          fi

      - name: Build Bundle (Research Site + Web Viewer)
        working-directory: atlas
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: lupi.live
          VITE_FIREBASE_PROJECT_ID: shed-489901
          VITE_FIREBASE_APP_ID: 1:350452481649:web:c12dea9ce6f6ae045065d0
          VITE_FIREBASE_STORAGE_BUCKET: shed-489901.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '350452481649'
          VITE_FIREBASE_MEASUREMENT_ID: G-BDBRM73QVJ
          VITE_FIREBASE_ANALYTICS_ENABLED: 'false'
          VITE_FIREBASE_ANALYTICS_CONSENT: denied
          VITE_LUPI_MCP_ENDPOINT: https://lupi.live/mcp
          VITE_LUPI_AUTH_FLOW: popup
          # NIST catalog + demo trajectories are served from a public GCS
          # bucket (shed-489901), not bundled. Vite inlines VITE_* at build.
          VITE_NIST_BASE_URL: https://storage.googleapis.com/shed-489901-nist-demos/nist
          # First-party analytics sink (Cloud Function → structured Cloud Logging).
          # The track() layer no-ops if this is unset; setting it turns measurement on.
          VITE_LUPI_ANALYTICS_URL: https://us-central1-shed-489901.cloudfunctions.net/collectAnalytics
        run: |
          pip install markdown
          python -c "import deploy_slim; deploy_slim.build_research(); deploy_slim.build_web()"

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Validate Secrets Pre-flight
        run: |
          if [ -z "${{ secrets.GCP_SERVICE_NAME_VIEWER }}" ]; then
            echo "::error::MISSING SECRET: GCP_SERVICE_NAME_VIEWER is not defined in GitHub Repo Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::error::MISSING SECRET: GCP_PROJECT_ID is not defined in GitHub Repo Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_REGION }}" ]; then
            echo "::error::MISSING SECRET: GCP_REGION is not defined in GitHub Repo Secrets."
            exit 1
          fi

      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          source: 'atlas/deploy_bundle'
          service: '${{ secrets.GCP_SERVICE_NAME_VIEWER }}'
          region: '${{ secrets.GCP_REGION }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          env_vars: |-
            VITE_FIREBASE_API_KEY=${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=lupi.live
            VITE_FIREBASE_PROJECT_ID=shed-489901
            VITE_FIREBASE_APP_ID=1:350452481649:web:c12dea9ce6f6ae045065d0
            VITE_FIREBASE_STORAGE_BUCKET=shed-489901.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=350452481649
            VITE_FIREBASE_MEASUREMENT_ID=G-BDBRM73QVJ
            VITE_FIREBASE_ANALYTICS_ENABLED=false
            VITE_FIREBASE_ANALYTICS_CONSENT=denied
          flags: '--allow-unauthenticated'

      - name: Show output
        run: echo ${{ steps.deploy.outputs.url }}
