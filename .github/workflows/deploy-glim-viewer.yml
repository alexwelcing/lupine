name: Retired LUPI viewer deploy guard

on:
  workflow_dispatch: {}

jobs:
  retired:
    runs-on: ubuntu-latest

    steps:
      - name: Report retired deploy path
        run: |
          {
            echo "### LUPI viewer deploy moved"
            echo
            echo "This monorepo workflow no longer deploys the viewer."
            echo "Production viewer deploys now run from alexwelcing/Lupi via .github/workflows/deploy-viewer.yml."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Retired deploy path. Use the standalone LUPI repo."
          exit 1
