name: Discovery Verify
on:
  push:
    paths: ['discovery/**', '.github/workflows/discovery-verify.yml']
  pull_request:
    paths: ['discovery/**', '.github/workflows/discovery-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    # The guarded archival worker requires unprivileged user/network namespaces.
    # ubuntu-latest refused this boundary in run 38087285589; never skip its tests.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: discovery
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[benchmark]'
      - name: Verify required user and network namespaces
        run: |
          LUPINE_PARENT_NETNS="$(readlink /proc/self/ns/net)" unshare --user --map-root-user --net python -c 'import os; assert os.readlink("/proc/self/ns/net") != os.environ["LUPINE_PARENT_NETNS"]; assert {line.split(":")[0].strip() for line in open("/proc/net/dev").read().splitlines()[2:]} == {"lo"}; print("Separate loopback-only network namespace verified")'
      - run: python -m unittest discover -s tests -v
      - run: lupine-discovery verify examples/abstract.json examples/abstract.certificate.json
      - run: lupine-discovery replay examples/abstract.json examples/abstract.outcomes.json
      - run: python scripts/runtime_manifest.py
      - run: python scripts/package_smoke.py --retain-directory .cache/release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-release-python-${{ matrix.python }}
          path: discovery/.cache/release-artifacts
          if-no-files-found: error
          retention-days: 90
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build pinned proof package
        working-directory: discovery/formal
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true
          lake --wfail build
          python3 -m unittest test_audit_axioms -v
          python3 audit_axioms.py
          git diff --exit-code -- AXIOMS.txt theorem-inventory.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test-ui]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-browser-checks
          path: discovery/.cache/browser
          retention-days: 7
