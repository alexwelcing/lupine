server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Efficient static serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Serve pre-compressed files when available (.gz)
    gzip_static on;

    # Runtime gzip for anything not pre-compressed
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        application/octet-stream
        image/svg+xml;

    # Health check for Cloud Run
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Branded Firebase Auth helper paths. LUPI is served from Cloud Run, so the
    # reserved Firebase auth handler must be proxied instead of falling through
    # to the SPA shell.
    location ^~ /__/auth/ {
        proxy_pass https://shed-489901.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host shed-489901.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /__/auth {
        proxy_pass https://shed-489901.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host shed-489901.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /__/firebase/init.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{
  "apiKey": "AIzaSyAPESEK0sgMh6NOq_3zQ83ndWQk4SxU954",
  "appId": "1:350452481649:web:c12dea9ce6f6ae045065d0",
  "authDomain": "lupi.live",
  "databaseURL": "",
  "measurementId": "G-BDBRM73QVJ",
  "messagingSenderId": "350452481649",
  "projectId": "shed-489901",
  "storageBucket": "shed-489901.firebasestorage.app"
}';
    }

    # SEO route HTML: serve canonical extensionless routes directly so nginx
    # does not redirect directory requests to an internal :8080 URL.
    location = /scenes/1m-copper-lattice {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        try_files /scenes/1m-copper-lattice/index.html /index.html;
    }

    location = /study/organic-functional-groups {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        try_files /study/organic-functional-groups/index.html /index.html;
    }

    location = /materials/omol25 {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        try_files /materials/omol25/index.html /index.html;
    }

    # LAMMPS trajectory / simulation data — highly compressible text
    location ~* \.(?:lammpstrj|xyz|dump)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
    }

    # Video files — already compressed, skip gzip, support Range
    location ~* \.(?:mp4|webm|ogg|mov)$ {
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
    }

    # Hashed static assets — long cache, immutable
    location ~* \.(?:js|css|wasm)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
    }

    # Images and fonts
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
    }

    # HTML pages — no aggressive caching for index.html updates!
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
    }

    # Default — SPA fallback for web app
    location / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        # No Cross-Origin-Embedder-Policy: require-corp — it breaks Firebase's
        # cross-origin auth iframe (sign-in completes but stays logged out) and
        # buys nothing here (no SharedArrayBuffer; COOP=allow-popups means the
        # page is not cross-origin isolated anyway). COOP alone keeps popups working.
        try_files $uri $uri/ /index.html;
    }
}
