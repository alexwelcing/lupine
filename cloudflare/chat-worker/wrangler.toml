name = "lupi-chat"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# ─── Route ───
# Bind to chat.lupine.dev once the DNS record is proxied through Cloudflare
# (orange-cloud). Uncomment after the DNS cutover, mirroring cdn-proxy.
#
# [[routes]]
# pattern = "chat.lupine.dev/*"
# zone_name = "lupine.dev"

# ─── KV: per-IP rate-limit counters ───
# Create the namespace once, then paste the returned id below:
#   wrangler kv namespace create CHAT_RL
# (and for `wrangler dev` against a local preview namespace:)
#   wrangler kv namespace create CHAT_RL --preview
[[kv_namespaces]]
binding = "CHAT_RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"          # from `wrangler kv namespace create CHAT_RL`
# preview_id = "REPLACE_WITH_PREVIEW_KV_ID"  # from `... create CHAT_RL --preview`

# ─── Vars ───
# This Worker uses the project's EXISTING MiniMax deployment (OpenAI-compatible
# api.minimax.io/v1) — NOT Anthropic — so this customer endpoint incurs no
# Anthropic token costs. The API key must be a secret; a model may be pinned here.
# [vars]
# MINIMAX_MODEL = "MiniMax-M2.7"
# MINIMAX_BASE_URL = "https://api.minimax.io/v1"
# RATE_LIMIT_MAX = "30"
# EXTRA_ALLOWED_ORIGINS = "https://preview.example.com"

# ─── Secrets (set via `wrangler secret put`) ───
# MINIMAX_API_KEY   — required. Already configured on this Cloudflare account
#                     (the glim-think Worker uses the same secret). Set with:
#                       wrangler secret put MINIMAX_API_KEY
# MINIMAX_MODEL     — optional override of the MiniMax model id (default MiniMax-M2.7).
# MINIMAX_BASE_URL  — optional override of the MiniMax base URL.

# ─── Observability ───
# Off by default for this lightweight public endpoint (logpush disabled).
[observability]
enabled = false

[observability.logs]
enabled = false
