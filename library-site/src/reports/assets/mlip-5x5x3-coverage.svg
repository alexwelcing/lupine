<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">5x5x3 campaign coverage</title>
  <desc id="desc">A coverage strip showing baseline complete, two promoted Distill cells per variant, four blocked or no-op cells per variant, and the remaining cells not yet run.</desc>
  <rect width="1100" height="520" rx="28" fill="#070b16"/>
  <rect x="20" y="20" width="1060" height="480" rx="22" fill="#0d1324" stroke="#26314f" stroke-width="1.5"/>
  <text x="48" y="62" fill="#eef5ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">5x5x3 evidence surface</text>
  <text x="48" y="94" fill="#a9b4c7" font-family="Inter, Arial, sans-serif" font-size="16">The baseline plane is complete. Distill planes have early cloud wins, but most cells are intentionally unclaimed.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="48" y="118" width="116" height="26" rx="13" fill="#0f3f2a" stroke="#22c55e"/>
    <text x="70" y="136" fill="#eafff3">complete/win</text>
    <rect x="176" y="118" width="128" height="26" rx="13" fill="#653018" stroke="#f97316"/>
    <text x="198" y="136" fill="#fff1e9">blocked/no-op</text>
    <rect x="316" y="118" width="104" height="26" rx="13" fill="#1f2937" stroke="#475569"/>
    <text x="340" y="136" fill="#d1d5db">not run</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="185" fill="#eef5ff" font-size="16" font-weight="800">Baseline</text>
    <text x="48" y="207" fill="#8f9bb1" font-size="12">25/25 complete</text>
    <text x="48" y="280" fill="#eef5ff" font-size="16" font-weight="800">Distill Accuracy</text>
    <text x="48" y="302" fill="#8f9bb1" font-size="12">2 wins, 4 blocked/no-op</text>
    <text x="48" y="375" fill="#eef5ff" font-size="16" font-weight="800">Accuracy + Accelerate</text>
    <text x="48" y="397" fill="#8f9bb1" font-size="12">2 wins, speed claim pending</text>
  </g>

