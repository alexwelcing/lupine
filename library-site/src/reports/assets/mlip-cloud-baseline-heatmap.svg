  <text x="48" y="630" fill="#8f9bb1" font-family="Inter, Arial, sans-serif" font-size="13">Interpretation: ORB-v3 leads three rows, CHGNet leads two rows, and M3GNet outliers mark a backend-contract issue to investigate before headline claims.</text>
