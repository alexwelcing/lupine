<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1100 680"><title id="title">MLIP baseline 5x5 rank heatmap</title><desc id="desc">A row-normalized rank heatmap showing five MLIPs across energy, forces, stress, elastic, and relaxation. Lower metric values rank better.</desc><rect width="1100" height="680" fill="#070b16" rx="28"/><rect width="1060" height="640" x="20" y="20" fill="#0d1324" stroke="#26314f" stroke-width="1.5" rx="22"/><text x="48" y="62" fill="#eef5ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Baseline 5x5: row rank heatmap</text><text x="48" y="94" fill="#a9b4c7" font-family="Inter, Arial, sans-serif" font-size="16">Rank is computed within each physics row; lower raw error is better. Raw values remain printed in each cell.</text><g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700"><rect width="92" height="26" x="48" y="118" fill="#0f3f2a" stroke="#22c55e" rx="13"/><text x="72" y="136" fill="#eafff3">rank 1</text><rect width="92" height="26" x="150" y="118" fill="#2e4a1f" stroke="#84cc16" rx="13"/><text x="174" y="136" fill="#f1ffe0">rank 2</text><rect width="92" height="26" x="252" y="118" fill="#5a3b10" stroke="#f59e0b" rx="13"/><text x="276" y="136" fill="#fff7df">rank 3</text><rect width="92" height="26" x="354" y="118" fill="#653018" stroke="#f97316" rx="13"/><text x="378" y="136" fill="#fff1e9">rank 4</text><rect width="92" height="26" x="456" y="118" fill="#5c1d24" stroke="#ef4444" rx="13"/><text x="480" y="136" fill="#ffecef">rank 5</text></g><g fill="#cdd8ea" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle"><text x="322" y="154">CHGNet</text><text x="484" y="154">M3GNet</text><text x="646" y="154">MACE</text><text x="808" y="154">ORB-v3</text><text x="970" y="154">SevenNet</text></g><g fill="#d7e0f0" font-family="Inter, Arial, sans-serif" font-size="15"><text x="48" y="214" font-