    <text x="48" y="300" font-weight="800">Forces</text>
    <text x="48" y="320" fill="#8f9bb1" font-size="12">eV/A RMSE</text>
    <text x="48" y="386" font-weight="800">Stress</text>
    <text x="48" y="406" fill="#8f9bb1" font-size="12">GPa MAE</text>
    <text x="48" y="472" font-weight="800">Elastic</text>
    <text x="48" y="492" fill="#8f9bb1" font-size="12">GPa MAE</text>
    <text x="48" y="558" font-weight="800">Relaxation</text>
    <text x="48" y="578" fill="#8f9bb1" font-size="12">sealed penalty</text>
  </g>

