<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1100 640"><title id="title">Distill triplet score ratios</title><desc id="desc">Grouped bars compare baseline, Distill Accuracy, and Distill Accuracy plus Accelerate as ratios to baseline. Lower ratios are better.</desc><rect width="1100" height="640" fill="#070b16" rx="28"/><rect width="1060" height="600" x="20" y="20" fill="#0d1324" stroke="#26314f" stroke-width="1.5" rx="22"/><text x="48" y="62" fill="#eef5ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Distill triplets: score ratio to baseline</text><text x="48" y="94" fill="#a9b4c7" font-family="Inter, Arial, sans-serif" font-size="16">Baseline is 1.00x for each cell. Lower is better. Energy improves; MACE stress is blocked.</text><g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700"><rect width="120" height="26" x="48" y="118" fill="#334155" rx="13"/><text x="73" y="136" fill="#e2e8f0">Baseline</text><rect width="150" height="26" x="180" y="118" fill="#14532d" stroke="#22c55e" rx="13"/><text x="204" y="136" fill="#eafff3">Distill Accuracy</text><rect width="220" height="26" x="342" y="118" fill="#243b66" stroke="#60a5fa" rx="13"/><text x="366" y="136" fill="#dbeafe">Accuracy + Accelerate</text></g><g fill="#748197" font-family="Inter, Arial, sans-serif" font-size="12"><line x1="120" x2="980" y1="500" y2="500" stroke="#26314f"/><line x1="120" x2="980" y1="402.8" y2="402.8" stroke="#26314f" stroke-dasharray="4 6"/><line x1="120" x2="980" y1="305.6" y2="305.6" stroke="#94a3b8" stroke-width="1.2"/><line x1="120" x2="980" y1="208.3" y2="208.3" stroke="#26314f" stroke-dasharray="4 6"/><text x="98" y="504" text-anchor="end">0.0x</text><text x="98" y="407" text-anchor="end">0.5x</text><text x="98" y="310" text-anchor="end">1.0x</text><text x="98" y="213" text-anchor="end">1.5x</text><text x="105" y="164" text-anchor="end">lower</text><text x="105" y="180" text-anchor="end">is better</text></g><g font-family="Inter, Arial, sans-serif" text-anchor="middle"><rect width="48" height="194.4" x="216" y="305.6" fill="#334155" rx="8"/><rect width="48" height="96.3" x="274" y="403.7" fill="#14532d" stroke="#22c55e" rx="8"/><rect width="48" height="96.3" x="332" y="403.7" fill="#243b66" stroke="#60a5fa" rx="8"/><text x="240" y="292" fill="#e2e8f0" font-size="13" font-weight="800">1.00x</text><text x="298" y="390" fill="#b9f6ca" font-size="13" font-weight="800">0.50x</text><text x="356" y="390" fill="#bfdbfe" font-size="13" font-weight="800">0.50x</text><text x="298" y="534" fill="#eef5ff" font-size="16" font-weight="800">MACE energy</text><text x="298" y="556" fill="#8f9bb1" font-size="12">0.4116 -&gt; 0.2038</text><text x="298" y="578" fill="#22c55e" font-size="13" font-weight="800">promoted</text><rect width="48" height="194.4" x="496" y="305.6" fill="#334155" rx="8"/><rect width="48" height="148.2" x="554" y="351.8" fill="#14532d" stroke="#22c55e" rx="8"/><rect width="48" height="135" x="612" y="365" fill="#243b66" stroke="#60a5fa" rx="8"/><text x="520" y="292" fill="#e2e8f0" font-size="13" font-weight="800">1.00x</text><text x="578" y="338" fill="#b9f6ca" font-size="13" font-weight="800">0.76x</text><text x="636" y="351" fill="#bfdbfe" font-size="13" font-weight="800">0.69x</text><text x="578" y="534" fill="#eef5ff" font-size="16" font-weight="800">SevenNet energy</text><text x="578" y="556" fill="#8f9bb1" font-size="12">0.3997 -&gt; 0.2773</text><text x="578" y="578" fill="#22c55e" font-size="13" font-weight="800">promoted</text><rect width="48" height="194.4" x="776" y="305.6" fill="#334155" rx="8"/><rect width="48" height="320.1" x="834" y="179.9" fill="#5c1d24" stroke="#ef4444" rx="8"/><rect width="48" height="262.1" x="892" y="237.9" fill="#653018" stroke="#f97316" rx="8"/><text x="800" y="292" fill="#e2e8f0" font-size="13" font-weight="800">1.00x</text><text x="858" y="166" fill="#fecdd3" font-size="13" font-weight="800">1.65x</text><text x="916" y="224" fill="#fed7aa" font-size="13" font-weight="800">1.35x</text><text x="858" y="534" fill="#eef5ff" font-size="16" font-weight="800">MACE stress</text><text x="858" y="556" fill="#8f9bb1" font-size="12">0.5669 -&gt; 0.9331</text><text x="858" y="578" fill="#f97316" font-size="13" font-weight="800">blocked</text></g><rect width="860" height="15" x="120" y="298" fill="#94a3b8" opacity=".12"/><text x="980" y="294" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="end">baseline line</text></svg>